<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sòlid — Ou pa konekte</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #ffffff;
        color: #343434;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        html, body {
          background: #1c1c1e;
          color: #f5f5f5;
        }
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 32px;
        text-align: center;
        box-sizing: border-box;
      }
      .badge {
        width: 64px;
        height: 64px;
        border-radius: 20px;
        background: #9fe870;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 28px;
        color: #1c1c1e;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0;
      }
      p {
        margin: 0;
        font-size: 0.95rem;
        color: inherit;
        opacity: 0.7;
        max-width: 320px;
      }
      button {
        margin-top: 8px;
        border: none;
        border-radius: 999px;
        background: #9fe870;
        color: #1c1c1e;
        font-weight: 700;
        font-size: 0.95rem;
        padding: 14px 28px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="badge">S</div>
      <h1>Ou pa konekte sou entènèt</h1>
      <p>Verifye koneksyon ou epi eseye ankò. Enfòmasyon sou kont ou (balans, tranzaksyon) mande yon koneksyon aktif.</p>
      <button onclick="location.reload()">Eseye ankò</button>
    </div>
  </body>
</html>
